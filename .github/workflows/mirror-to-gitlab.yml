name: Mirror GitHub -> GitLab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-to-gitlab
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Evitar bucles de sincronizacion
        id: guard
        run: |
          MSG="$(git log -1 --pretty=%B)"
          echo "$MSG"
          if printf '%s' "$MSG" | grep -q '\[skip mirror\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Commit de mirror: no se reenvia."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar clave de despliegue de GitLab
        if: steps.guard.outputs.skip != 'true'
        env:
          GL_DEPLOY_KEY: ${{ secrets.GL_DEPLOY_KEY }}
        run: |
          if [ -z "$GL_DEPLOY_KEY" ]; then
            echo "Falta el secreto GL_DEPLOY_KEY" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$GL_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H gitlab.com >> ~/.ssh/known_hosts

      - name: Sincronizar con GitLab
        if: steps.guard.outputs.skip != 'true'
        env:
          GIT_AUTHOR_NAME: mirror-bot
          GIT_AUTHOR_EMAIL: mirror-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: mirror-bot
          GIT_COMMITTER_EMAIL: mirror-bot@users.noreply.github.com
        run: |
          git config user.name mirror-bot
          git config user.email mirror-bot@users.noreply.github.com
          git remote add gitlab git@gitlab.com:BENDER_5000/sc_autoinst_win_C20.git

          if git fetch gitlab main; then
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then
              echo "Ya estan sincronizados."
              exit 0
            fi
            git merge --no-edit -m "chore: sync from GitLab [skip mirror]" FETCH_HEAD \
              || { echo "Conflicto al fusionar GitLab -> GitHub" >&2; exit 1; }
          fi

          git push gitlab HEAD:main
          echo 'Sincronizado GitHub -> GitLab:' "$(git rev-parse HEAD)"
